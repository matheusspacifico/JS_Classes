<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de CEP</title>
    <link rel="icon" href="data:image">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>

    <div class="container">

        <form id="formulario" class="form-group">
            <p>
                <label for="cep">Digite um CEP: </label>
                <input type="text" id="cep" placeholder="01001000">
            </p>
            <p>
                <input type="submit" id="enviar" class="submit-button" value="Enviar">
            </p>
        </form>

        <div id="informacoes" class="information">

        </div>
        
        <div class="creditos">
            <p>Créditos da API: <a href="https://viacep.com.br/" target="_blank">https://viacep.com.br/</a></p>
            <p>Página atual feita por <a href="https://github.com/matheusspacifico" target="_blank">Matheus S. Pacífico</a></p>
        </div>

    </div>

    <script src="./script.js"></script>
</body>
</html>
